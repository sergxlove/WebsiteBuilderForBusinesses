version: '3.8'

services:
  webbuilder-db:
    image: postgres:15-alpine
    container_name: webbuilder-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: db
    ports:
      - "5432:5432"
    volumes:
      - postgres-/var/lib/postgresql/data
    restart: unless-stopped
  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_API_KEY=OOl3Wum0D07sGQqF
      - SEQ_FIRSTRUN_ADMINPASSWORD=M0xynmCS4rYePGni
    ports:
      - "5341:80"
    volumes:
      - seq-/data
    restart: unless-stopped
volumes:
  postgres-
  seq-