<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DarkForge · Мои проекты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05070c;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0a0d16, #03050a);
            z-index: -1;
        }

        .projects-container {
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .header {
            background: #0f121c;
            border-radius: 1.5rem;
            padding: 1rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid #2d3448;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 1.8rem;
            filter: drop-shadow(0 2px 4px rgba(139,92,246,0.3));
        }

        .brand-title {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e0e7ff, #c4b5fd);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #0a0d16;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid #2d3448;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
        }

        .user-name {
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .logout-link {
            color: #f87171;
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: underline;
            transition: 0.2s;
        }

            .logout-link:hover {
                color: #ff9999;
            }

        .actions-bar {
            background: #0f121c;
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border: 1px solid #2d3448;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            border: none;
            padding: 10px 24px;
            border-radius: 2rem;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 6px 16px rgba(139,92,246,0.4);
            }

        .search-box {
            display: flex;
            gap: 8px;
            align-items: center;
            background: #010101;
            border: 1px solid #2d3445;
            border-radius: 2rem;
            padding: 4px 16px;
        }

            .search-box input {
                background: transparent;
                border: none;
                padding: 8px 0;
                color: #f0f3fa;
                font-size: 0.85rem;
                width: 200px;
                outline: none;
            }

                .search-box input::placeholder {
                    color: #5f6c84;
                }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .project-card {
            background: #0f121c;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid #2d3448;
            transition: all 0.3s ease;
            cursor: pointer;
        }

            .project-card:hover {
                transform: translateY(-5px);
                border-color: #8b5cf6;
                box-shadow: 0 12px 28px rgba(139,92,246,0.2);
            }

        .project-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .project-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #e2e8f0;
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .project-date {
            font-size: 0.7rem;
            color: #7e8aa2;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .project-actions {
            display: flex;
            gap: 12px;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #2d3448;
        }

        .project-action-btn {
            background: transparent;
            border: none;
            padding: 6px 12px;
            border-radius: 2rem;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

            .project-action-btn.edit {
                color: #a78bfa;
            }

                .project-action-btn.edit:hover {
                    background: rgba(139,92,246,0.15);
                }

            .project-action-btn.delete {
                color: #f87171;
            }

                .project-action-btn.delete:hover {
                    background: rgba(239,68,68,0.15);
                }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: #0f121c;
            border-radius: 1.5rem;
            border: 1px solid #2d3448;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 1.2rem;
            color: #e2e8f0;
            margin-bottom: 0.5rem;
        }

        .empty-state-text {
            color: #7e8aa2;
            font-size: 0.85rem;
        }

        .loading-state {
            text-align: center;
            padding: 4rem 2rem;
            background: #0f121c;
            border-radius: 1.5rem;
            border: 1px solid #2d3448;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(139,92,246,0.3);
            border-radius: 50%;
            border-top-color: #8b5cf6;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        .error-state {
            text-align: center;
            padding: 4rem 2rem;
            background: #0f121c;
            border-radius: 1.5rem;
            border: 1px solid #ef4444;
        }

        .error-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.6;
        }

        .error-state-title {
            font-size: 1.2rem;
            color: #f87171;
            margin-bottom: 0.5rem;
        }

        .error-state-text {
            color: #9ca3af;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .retry-btn {
            background: #1a1f2c;
            border: 1px solid #8b5cf6;
            padding: 8px 24px;
            border-radius: 2rem;
            color: #c4b5fd;
            cursor: pointer;
            transition: 0.2s;
        }

            .retry-btn:hover {
                background: #2d3448;
            }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            max-width: 350px;
            padding: 12px 20px;
            border-radius: 1rem;
            font-size: 0.85rem;
            animation: slideInRight 0.3s ease;
        }

        .toast-error {
            background: rgba(239,68,68,0.95);
            color: white;
            border-left: 4px solid #ff9999;
        }

        .toast-success {
            background: rgba(74,222,128,0.95);
            color: #1a1f2c;
            border-left: 4px solid #22c55e;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* МОДАЛЬНОЕ ОКНО */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: #0f121c;
            border-radius: 2rem;
            width: 420px;
            max-width: 90%;
            padding: 2rem;
            border: 1px solid #2d3448;
            animation: fadeInUp 0.25s ease;
        }

            .modal h3 {
                color: #e2e8f0;
                margin-bottom: 1.5rem;
                text-align: center;
            }

            .modal input {
                width: 100%;
                padding: 12px 16px;
                background: #010101;
                border: 1px solid #2d3445;
                border-radius: 1rem;
                color: #f0f3fa;
                font-size: 0.9rem;
                margin-bottom: 1.5rem;
            }

                .modal input:focus {
                    outline: none;
                    border-color: #8b5cf6;
                }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #4c3a6e;
            padding: 8px 20px;
            border-radius: 2rem;
            color: #c4b5fd;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }

            .btn-outline:hover {
                background: rgba(139,92,246,0.1);
                border-color: #a78bfa;
            }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="projects-container">
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">🎨⚡</div>
                <div class="brand-title">DarkForge Pro</div>
            </div>
            <div class="user-info">
                <div class="user-avatar">A</div>
                <span class="user-name">Александр</span>
                <span class="logout-link" id="logoutBtn">Выйти</span>
            </div>
        </div>

        <!-- ПАНЕЛЬ ДЕЙСТВИЙ -->
        <div class="actions-bar">
            <button class="btn-primary" id="createProjectBtn">➕ Создать проект</button>
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Поиск проектов...">
            </div>
        </div>

        <!-- СЕТКА ПРОЕКТОВ -->
        <div id="projectsGrid" class="projects-grid">
            <!-- Проект 1 -->
            <div class="project-card" data-id="1">
                <div class="project-icon">🎨</div>
                <div class="project-name">Мой первый сайт</div>
                <div class="project-date">
                    <span>📅</span> 15 марта 2025
                </div>
                <div class="project-actions">
                    <button class="project-action-btn edit" data-id="1">✏️ Редактировать</button>
                    <button class="project-action-btn delete" data-id="1">🗑 Удалить</button>
                </div>
            </div>

            <!-- Проект 2 -->
            <div class="project-card" data-id="2">
                <div class="project-icon">🛍️</div>
                <div class="project-name">Интернет-магазин</div>
                <div class="project-date">
                    <span>📅</span> 22 марта 2025
                </div>
                <div class="project-actions">
                    <button class="project-action-btn edit" data-id="2">✏️ Редактировать</button>
                    <button class="project-action-btn delete" data-id="2">🗑 Удалить</button>
                </div>
            </div>

            <!-- Проект 3 -->
            <div class="project-card" data-id="3">
                <div class="project-icon">📱</div>
                <div class="project-name">Лендинг для стартапа</div>
                <div class="project-date">
                    <span>📅</span> 5 апреля 2025
                </div>
                <div class="project-actions">
                    <button class="project-action-btn edit" data-id="3">✏️ Редактировать</button>
                    <button class="project-action-btn delete" data-id="3">🗑 Удалить</button>
                </div>
            </div>

            <!-- Проект 4 -->
            <div class="project-card" data-id="4">
                <div class="project-icon">✍️</div>
                <div class="project-name">Личный блог</div>
                <div class="project-date">
                    <span>📅</span> 10 апреля 2025
                </div>
                <div class="project-actions">
                    <button class="project-action-btn edit" data-id="4">✏️ Редактировать</button>
                    <button class="project-action-btn delete" data-id="4">🗑 Удалить</button>
                </div>
            </div>

            <!-- Проект 5 -->
            <div class="project-card" data-id="5">
                <div class="project-icon">🏢</div>
                <div class="project-name">Корпоративный портал</div>
                <div class="project-date">
                    <span>📅</span> 18 апреля 2025
                </div>
                <div class="project-actions">
                    <button class="project-action-btn edit" data-id="5">✏️ Редактировать</button>
                    <button class="project-action-btn delete" data-id="5">🗑 Удалить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (function () {
        // Эмуляция работы с сервером (для демонстрации)
        let projects = [
            { id: '1', name: 'Мой первый сайт', dateOpen: '2025-03-15T10:00:00' },
            { id: '2', name: 'Интернет-магазин', dateOpen: '2025-03-22T14:30:00' },
            { id: '3', name: 'Лендинг для стартапа', dateOpen: '2025-04-05T09:15:00' },
            { id: '4', name: 'Личный блог', dateOpen: '2025-04-10T16:45:00' },
            { id: '5', name: 'Корпоративный портал', dateOpen: '2025-04-18T11:20:00' }
        ];

        const projectsGrid = document.getElementById('projectsGrid');
        const searchInput = document.getElementById('searchInput');
        const createProjectBtn = document.getElementById('createProjectBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        function formatDate(dateString) {
            if (!dateString) return 'Дата неизвестна';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return 'Дата неизвестна';
                return date.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            } catch {
                return 'Дата неизвестна';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, m => {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function filterProjects() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            if (!searchTerm) return projects;
            return projects.filter(p => p.name && p.name.toLowerCase().includes(searchTerm));
        }

        function renderProjects() {
            const filtered = filterProjects();

            if (filtered.length === 0) {
                projectsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">🔍</div>
                        <div class="empty-state-title">Ничего не найдено</div>
                        <div class="empty-state-text">Попробуйте изменить поисковый запрос</div>
                    </div>
                `;
                return;
            }

            projectsGrid.innerHTML = filtered.map(project => `
                <div class="project-card" data-id="${project.id}">
                    <div class="project-icon">${getProjectIcon(project.name)}</div>
                    <div class="project-name">${escapeHtml(project.name)}</div>
                    <div class="project-date">
                        <span>📅</span> ${formatDate(project.dateOpen)}
                    </div>
                    <div class="project-actions">
                        <button class="project-action-btn edit" data-id="${project.id}">
                            ✏️ Редактировать
                        </button>
                        <button class="project-action-btn delete" data-id="${project.id}">
                            🗑 Удалить
                        </button>
                    </div>
                </div>
            `).join('');

            // Обработчики для карточек
            document.querySelectorAll('.project-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.project-action-btn')) {
                        const projectId = card.getAttribute('data-id');
                        openProject(projectId);
                    }
                });
            });

            // Обработчики для кнопок редактирования
            document.querySelectorAll('.project-action-btn.edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const projectId = btn.getAttribute('data-id');
                    openProject(projectId);
                });
            });

            // Обработчики для кнопок удаления
            document.querySelectorAll('.project-action-btn.delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const projectId = btn.getAttribute('data-id');
                    deleteProject(projectId);
                });
            });
        }

        function getProjectIcon(name) {
            const icons = {
                'магазин': '🛍️',
                'блог': '✍️',
                'лендинг': '📱',
                'портал': '🏢',
                'сайт': '🎨'
            };
            for (const [key, icon] of Object.entries(icons)) {
                if (name.toLowerCase().includes(key)) return icon;
            }
            return '🎨';
        }

        function openProject(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (project) {
                showToast(`Открытие проекта "${project.name}"...`, false);
                setTimeout(() => {
                    window.location.href = `builder.html?projectId=${projectId}`;
                }, 500);
            }
        }

        function deleteProject(projectId) {
            const project = projects.find(p => p.id === projectId);
            if (!confirm(`Вы уверены, что хотите удалить проект "${project.name}"? Действие необратимо.`)) {
                return;
            }

            projects = projects.filter(p => p.id !== projectId);
            renderProjects();
            showToast(`Проект "${project.name}" удалён`, false);
        }

        function showCreateProjectModal() {
            const modal = document.createElement('div');
            modal.className = 'modal-overlay';
            modal.innerHTML = `
                <div class="modal">
                    <h3>Создание нового проекта</h3>
                    <input type="text" id="projectNameInput" placeholder="Название проекта" autocomplete="off">
                    <div class="modal-buttons">
                        <button class="btn-outline" id="cancelModalBtn">Отмена</button>
                        <button class="btn-primary" id="confirmCreateBtn">Создать</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            const nameInput = modal.querySelector('#projectNameInput');
            const confirmBtn = modal.querySelector('#confirmCreateBtn');
            const cancelBtn = modal.querySelector('#cancelModalBtn');

            const closeModal = () => modal.remove();

            const createProject = () => {
                const projectName = nameInput.value.trim();
                if (!projectName) {
                    nameInput.style.borderColor = '#f87171';
                    nameInput.focus();
                    return;
                }

                const newProject = {
                    id: Date.now().toString(),
                    name: projectName,
                    dateOpen: new Date().toISOString()
                };

                projects.unshift(newProject);
                renderProjects();
                closeModal();
                showToast(`Проект "${projectName}" создан`, false);

                setTimeout(() => {
                    openProject(newProject.id);
                }, 500);
            };

            nameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') createProject();
            });
            confirmBtn.addEventListener('click', createProject);
            cancelBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            nameInput.focus();
        }

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function logout() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                showToast('Выход из системы...', false);
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 500);
            }
        }

        // Поиск с debounce
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                renderProjects();
            }, 300);
        });

        createProjectBtn.addEventListener('click', showCreateProjectModal);
        logoutBtn.addEventListener('click', logout);

        // Инициализация
        renderProjects();
    })();
    </script>
</body>
</html>
