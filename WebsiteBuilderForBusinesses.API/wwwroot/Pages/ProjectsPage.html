<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="../Styles/ProjectsPage.css">
    <title>DarkForge · Мои проекты</title>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="projects-container">
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon">🎨⚡</div>
                <div class="brand-title">DarkForge Pro</div>
            </div>
            <div class="user-info" id="userInfo">
                <div class="user-avatar" id="userAvatar">?</div>
                <span class="user-name" id="userName">Загрузка...</span>
                <span class="logout-link" id="logoutBtn">Выйти</span>
            </div>
        </div>
        <div class="actions-bar">
            <button class="btn-primary" id="createProjectBtn">➕ Создать проект</button>
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Поиск проектов...">
            </div>
        </div>
        <div id="projectsGrid" class="projects-grid"></div>
    </div>
    <script>
        (function () {
            let projects = [];
            let isLoading = false;
            let currentUser = null;
            const projectsGrid = document.getElementById('projectsGrid');
            const searchInput = document.getElementById('searchInput');
            const createProjectBtn = document.getElementById('createProjectBtn');
            const userNameSpan = document.getElementById('userName');
            const userAvatarSpan = document.getElementById('userAvatar');
            const logoutBtn = document.getElementById('logoutBtn');
            function showToast(message, isError = false) {
                const toast = document.createElement('div');
                toast.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
            function getEmailFromJwt() {
                const cookies = document.cookie.split(';');
                let jwtToken = null;
                for (let cookie of cookies) {
                    const [name, value] = cookie.trim().split('=');
                    if (name === 'jwt') {
                        jwtToken = value;
                        break;
                    }
                }
                if (!jwtToken) {
                    console.error('JWT token not found');
                    return null;
                }
                try {
                    const parts = jwtToken.split('.');
                    if (parts.length !== 3) {
                        console.error('Invalid JWT format');
                        return null;
                    }
                    const payload = JSON.parse(atob(parts[1]));
                    const email = payload['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress']
                        || payload['email']
                        || payload['Email']
                        || payload['unique_name']
                        || null;
                    return email;
                } catch (error) {
                    console.error('Error decoding JWT:', error);
                    return null;
                }
            }
            function loadUserInfo() {
                const email = getEmailFromJwt();
                if (email) {
                    currentUser = email;
                    userNameSpan.textContent = currentUser;
                    const firstChar = currentUser.charAt(0).toUpperCase();
                    userAvatarSpan.textContent = firstChar;
                } else {
                    userNameSpan.textContent = 'Гость';
                    userAvatarSpan.textContent = '?';
                    showToast('Сессия не найдена. Пожалуйста, войдите снова.', true);
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                }
            }
            async function logout() {
                if (!confirm('Вы уверены, что хотите выйти?')) {
                    return;
                }
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    const response = await fetch('/logout', {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        },
                        credentials: 'include',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    if (response.ok) {
                        showToast('Выход выполнен успешно', false);
                        setTimeout(() => {
                            window.location.href = 'login.html';
                        }, 500);
                    } else {
                        showToast('Ошибка при выходе', true);
                    }
                } catch (error) {
                    console.error('Logout error:', error);
                    if (error.name === 'AbortError') {
                        showToast('Превышено время ожидания', true);
                    } else {
                        showToast('Не удалось выполнить выход', true);
                    }
                }
            }
            function formatDate(dateString) {
                if (!dateString) return 'Дата неизвестна';
                try {
                    const date = new Date(dateString);
                    if (isNaN(date.getTime())) return 'Дата неизвестна';
                    return date.toLocaleDateString('ru-RU', {
                        day: 'numeric',
                        month: 'long',
                        year: 'numeric'
                    });
                } catch {
                    return 'Дата неизвестна';
                }
            }
            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, m => {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
            function getProjectIcon(name) {
                const icons = {
                    'магазин': '🛍️',
                    'блог': '✍️',
                    'лендинг': '📱',
                    'портал': '🏢',
                    'сайт': '🎨'
                };
                for (const [key, icon] of Object.entries(icons)) {
                    if (name && name.toLowerCase().includes(key)) return icon;
                }
                return '🎨';
            }
            function filterProjects() {
                const searchTerm = searchInput.value.toLowerCase().trim();
                if (!searchTerm) return projects;
                return projects.filter(p => p.name && p.name.toLowerCase().includes(searchTerm));
            }
            function renderProjects() {
                if (!projects || projects.length === 0) {
                    projectsGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📁</div>
                            <div class="empty-state-title">Нет проектов</div>
                            <div class="empty-state-text">Создайте свой первый проект, нажав на кнопку выше</div>
                        </div>
                    `;
                    return;
                }
                const filtered = filterProjects();
                if (filtered.length === 0) {
                    projectsGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🔍</div>
                            <div class="empty-state-title">Ничего не найдено</div>
                            <div class="empty-state-text">Попробуйте изменить поисковый запрос</div>
                        </div>
                    `;
                    return;
                }
                projectsGrid.innerHTML = filtered.map(project => `
                    <div class="project-card" data-id="${project.id}" data-name="${escapeHtml(project.name)}">
                        <div class="project-icon">${getProjectIcon(project.name)}</div>
                        <div class="project-name">${escapeHtml(project.name)}</div>
                        <div class="project-date">
                            <span>📅</span> ${formatDate(project.dateOpen)}
                        </div>
                        <div class="project-actions">
                            <button class="project-action-btn open" data-id="${project.id}">
                                🚀 Открыть
                            </button>
                            <button class="project-action-btn rename" data-id="${project.id}" data-name="${escapeHtml(project.name)}">
                                📝 Переименовать
                            </button>
                            <button class="project-action-btn delete" data-id="${project.id}">
                                🗑 Удалить
                            </button>
                        </div>
                    </div>
                `).join('');
                document.querySelectorAll('.project-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (!e.target.closest('.project-action-btn')) {
                            const projectId = card.getAttribute('data-id');
                            openProject(projectId);
                        }
                    });
                });
                document.querySelectorAll('.project-action-btn.open').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const projectId = btn.getAttribute('data-id');
                        openProject(projectId);
                    });
                });
                document.querySelectorAll('.project-action-btn.rename').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const projectId = btn.getAttribute('data-id');
                        const currentName = btn.getAttribute('data-name');
                        showRenameProjectModal(projectId, currentName);
                    });
                });
                document.querySelectorAll('.project-action-btn.delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const projectId = btn.getAttribute('data-id');
                        deleteProject(projectId);
                    });
                });
            }
            function showLoadingState() {
                projectsGrid.innerHTML = `
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <div class="empty-state-title">Загрузка проектов...</div>
                        <div class="empty-state-text">Пожалуйста, подождите</div>
                    </div>
                `;
            }
            function showServerErrorState() {
                projectsGrid.innerHTML = `
                    <div class="error-state">
                        <div class="error-state-icon">🌐</div>
                        <div class="error-state-title">Нет подключения к серверу</div>
                        <div class="error-state-text">
                            Не удалось загрузить проекты. Проверьте подключение к интернету.
                        </div>
                        <button class="retry-btn" id="retryLoadBtn">🔄 Повторить попытку</button>
                    </div>
                `;
                const retryBtn = document.getElementById('retryLoadBtn');
                if (retryBtn) {
                    retryBtn.addEventListener('click', () => loadProjects());
                }
            }
            async function loadProjects() {
                if (isLoading) return;
                isLoading = true;
                createProjectBtn.disabled = true;
                showLoadingState();
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);

                    const response = await fetch('/project/all', {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        },
                        credentials: 'include',
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);
                    if (response.ok) {
                        projects = await response.json();
                        renderProjects();
                    } else {
                        projects = [];
                        showServerErrorState();
                    }
                } catch (error) {
                    console.error('Load projects error:', error);
                    projects = [];
                    if (error.name === 'AbortError') {
                        projectsGrid.innerHTML = `
                            <div class="error-state">
                                <div class="error-state-icon">⏱️</div>
                                <div class="error-state-title">Превышено время ожидания</div>
                                <div class="error-state-text">Сервер не отвечает. Попробуйте позже.</div>
                                <button class="retry-btn" id="retryLoadBtn">🔄 Повторить</button>
                            </div>
                        `;
                    } else {
                        showServerErrorState();
                    }
                    const retryBtn = document.getElementById('retryLoadBtn');
                    if (retryBtn) {
                        retryBtn.addEventListener('click', () => loadProjects());
                    }
                } finally {
                    isLoading = false;
                    createProjectBtn.disabled = false;
                }
            }
            function openProject(projectId) {
                const project = projects.find(p => p.id === projectId);
                if (project) {
                    window.location.href = `builder.html?projectId=${projectId}`;
                }
            }
            function showRenameProjectModal(projectId, currentName) {
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal">
                        <h3>Переименование проекта</h3>
                        <input type="text" id="projectNewNameInput" placeholder="Новое название проекта" value="${escapeHtml(currentName)}" autocomplete="off">
                        <div class="modal-buttons">
                            <button class="btn-outline" id="cancelModalBtn">Отмена</button>
                            <button class="btn-primary" id="confirmRenameBtn">Сохранить</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                const nameInput = modal.querySelector('#projectNewNameInput');
                const confirmBtn = modal.querySelector('#confirmRenameBtn');
                const cancelBtn = modal.querySelector('#cancelModalBtn');
                const closeModal = () => modal.remove();
                const renameProject = async () => {
                    const newName = nameInput.value.trim();
                    if (!newName) {
                        nameInput.style.borderColor = '#f87171';
                        nameInput.focus();
                        return;
                    }
                    if (newName === currentName) {
                        closeModal();
                        return;
                    }
                    confirmBtn.disabled = true;
                    confirmBtn.innerHTML = 'Сохранение...';
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 10000);
                        const response = await fetch('/project/name/update', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            credentials: 'include',
                            signal: controller.signal,
                            body: JSON.stringify({
                                oldName: currentName,
                                newName: newName
                            })
                        });
                        clearTimeout(timeoutId);
                        if (response.ok) {
                            closeModal();
                            showToast(`Проект переименован в "${newName}"`, false);
                            await loadProjects();
                        } else if (response.status === 400) {
                            const errorText = await response.text();
                            showToast(errorText || 'Ошибка переименования', true);
                        } else {
                            showToast('Ошибка при переименовании проекта', true);
                        }
                    } catch (error) {
                        console.error('Rename error:', error);
                        if (error.name === 'AbortError') {
                            showToast('Превышено время ожидания', true);
                        } else {
                            showToast('Не удалось переименовать проект', true);
                        }
                    } finally {
                        confirmBtn.disabled = false;
                        confirmBtn.innerHTML = 'Сохранить';
                    }
                };
                nameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') renameProject();
                });
                confirmBtn.addEventListener('click', renameProject);
                cancelBtn.addEventListener('click', closeModal);
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });
                nameInput.select();
                nameInput.focus();
            }
            async function deleteProject(projectId) {
                const project = projects.find(p => p.id === projectId);
                if (!confirm(`Вы уверены, что хотите удалить проект "${project.name}"? Действие необратимо.`)) {
                    return;
                }
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 10000);
                    const response = await fetch('/project/html', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        credentials: 'include',
                        signal: controller.signal,
                        body: JSON.stringify({ id: projectId })
                    });
                    clearTimeout(timeoutId);
                    if (response.ok) {
                        showToast(`Проект "${project.name}" удалён`, false);
                        await loadProjects();
                    } else if (response.status === 400) {
                        const errorText = await response.text();
                        showToast(errorText || 'Проект не был удален из-за ошибки', true);
                    } else {
                        showToast('Ошибка при удалении проекта', true);
                    }
                } catch (error) {
                    console.error('Delete error:', error);
                    if (error.name === 'AbortError') {
                        showToast('Превышено время ожидания', true);
                    } else {
                        showToast('Не удалось удалить проект', true);
                    }
                }
            }
            function showCreateProjectModal() {
                const modal = document.createElement('div');
                modal.className = 'modal-overlay';
                modal.innerHTML = `
                    <div class="modal">
                        <h3>Создание нового проекта</h3>
                        <input type="text" id="projectNameInput" placeholder="Название проекта" autocomplete="off">
                        <div class="modal-buttons">
                            <button class="btn-outline" id="cancelModalBtn">Отмена</button>
                            <button class="btn-primary" id="confirmCreateBtn">Создать</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
                const nameInput = modal.querySelector('#projectNameInput');
                const confirmBtn = modal.querySelector('#confirmCreateBtn');
                const cancelBtn = modal.querySelector('#cancelModalBtn');
                const closeModal = () => modal.remove();
                const createProject = async () => {
                    const projectName = nameInput.value.trim();
                    if (!projectName) {
                        nameInput.style.borderColor = '#f87171';
                        nameInput.focus();
                        return;
                    }
                    confirmBtn.disabled = true;
                    confirmBtn.innerHTML = 'Создание...';
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 10000);
                        const response = await fetch('/project/new', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Accept': 'application/json'
                            },
                            credentials: 'include',
                            signal: controller.signal,
                            body: JSON.stringify({ name: projectName })
                        });
                        clearTimeout(timeoutId);
                        if (response.ok) {
                            closeModal();
                            showToast(`Проект "${projectName}" создан`, false);
                            await loadProjects();
                        } else if (response.status === 400) {
                            const errorText = await response.text();
                            showToast(errorText || 'Ошибка создания', true);
                        } else {
                            showToast('Ошибка при создании проекта', true);
                        }
                    } catch (error) {
                        console.error('Create error:', error);
                        if (error.name === 'AbortError') {
                            showToast('Превышено время ожидания', true);
                        } else {
                            showToast('Не удалось создать проект', true);
                        }
                    } finally {
                        confirmBtn.disabled = false;
                        confirmBtn.innerHTML = 'Создать';
                    }
                };
                nameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') createProject();
                });
                confirmBtn.addEventListener('click', createProject);
                cancelBtn.addEventListener('click', closeModal);
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });
                nameInput.focus();
            }
            let searchTimeout;
            searchInput.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    if (projects && projects.length > 0) {
                        renderProjects();
                    }
                }, 300);
            });
            createProjectBtn.addEventListener('click', showCreateProjectModal);
            logoutBtn.addEventListener('click', logout);
            loadUserInfo();
            loadProjects();
        })();
    </script>
</body>
</html>
