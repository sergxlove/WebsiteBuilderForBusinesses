<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="../Styles/LoginPage.css">
    <title>DarkForge · Вход в конструктор сайтов</title>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="login-page">
        <div class="login-card">
            <div class="logo-header">
                <div class="logo-icon">🎨⚡</div>
                <div class="brand-title">DarkForge Pro</div>
                <div class="brand-sub">Конструктор сайтов нового поколения</div>
            </div>
            <div class="input-group">
                <label>📧 Логин / Email</label>
                <input type="text" id="loginUsername" placeholder="Введите ваш логин" autocomplete="username">
            </div>
            <div class="input-group">
                <label>🔒 Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль" autocomplete="current-password">
            </div>
            <button class="login-btn-submit" id="loginButton">Войти в конструктор →</button>
            <div id="messageContainer"></div>
            <div class="footer-note">
                ⚡ Профессиональный конструктор | Тёмная тема | 40+ элементов
            </div>
        </div>
    </div>
    <script>
        (function () {
            const loginBtn = document.getElementById('loginButton');
            const usernameInput = document.getElementById('loginUsername');
            const passwordInput = document.getElementById('loginPassword');
            const messageContainer = document.getElementById('messageContainer');
            let isLoading = false;
            function showMessage(text, isError = true) {
                messageContainer.innerHTML = `
                    <div class="${isError ? 'error-message' : 'success-message'}">
                        ${text}
                    </div>
                `;
                if (isError) {
                    setTimeout(() => {
                        if (messageContainer.innerHTML.includes(text)) {
                            messageContainer.innerHTML = '';
                        }
                    }, 5000);
                }
            }
            function clearMessages() {
                messageContainer.innerHTML = '';
            }
            async function attemptLogin() {
                const username = usernameInput.value.trim();
                const password = passwordInput.value;
                clearMessages();
                if (username.length === 0) {
                    showMessage('❌ Введите логин', true);
                    usernameInput.focus();
                    return;
                }
                if (password.length === 0) {
                    showMessage('❌ Введите пароль', true);
                    passwordInput.focus();
                    return;
                }
                if (isLoading) return;
                isLoading = true;
                loginBtn.disabled = true;
                const originalBtnText = loginBtn.innerHTML;
                loginBtn.innerHTML = '<span class="loading-spinner"></span> Вход...';
                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        credentials: 'include', 
                        body: JSON.stringify({
                            login: username,
                            password: password
                        })
                    });
                    if (response.ok) {
                        const userData = {
                            username: username,
                            loginTime: Date.now(),
                            isAuthenticated: true
                        };
                        localStorage.setItem('darkforge_auth', JSON.stringify(userData));
                        showMessage('✅ Вход выполнен успешно! Перенаправление...', false);
                        setTimeout(() => {
                            window.location.href = '/page/projects';
                        }, 800);
                    } else if (response.status === 400) {
                        let errorText = '❌ Неверный логин или пароль';
                        try {
                            const errorData = await response.text();
                            if (errorData && errorData.length > 0) {
                                errorText = `❌ ${errorData}`;
                            }
                        } catch (e) {
                        }
                        showMessage(errorText, true);
                        const card = document.querySelector('.login-card');
                        card.style.transform = 'translateX(4px)';
                        setTimeout(() => { card.style.transform = ''; }, 100);
                    } else if (response.status === 429) {
                        showMessage('⚠️ Слишком много попыток входа. Попробуйте позже.', true);
                    } else if (response.status === 500) {
                        showMessage('⚠️ Внутренняя ошибка сервера. Попробуйте позже.', true);
                    } else {
                        showMessage(`⚠️ Ошибка: ${response.status}. Попробуйте позже.`, true);
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    let errorMsg = '⚠️ Не удалось соединиться с сервером. Проверьте подключение.';
                    if (error.message && error.message.includes('Failed to fetch')) {
                        errorMsg = '⚠️ Сервер недоступен. Убедитесь, что сервер запущен.';
                    }
                    showMessage(errorMsg, true);
                } finally {
                    isLoading = false;
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalBtnText;
                }
            }
            loginBtn.addEventListener('click', attemptLogin);
            const handleEnter = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    attemptLogin();
                }
            };
            usernameInput.addEventListener('keypress', handleEnter);
            passwordInput.addEventListener('keypress', handleEnter);
        })();
    </script>
</body>
</html>
