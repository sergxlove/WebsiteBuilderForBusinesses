<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <link rel="stylesheet" href="../Styles/RegPage.css">
    <title>DarkForge · Регистрация</title>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="register-page">
        <div class="register-card">
            <div class="logo-header">
                <div class="logo-icon">🎨⚡</div>
                <div class="brand-title">DarkForge Pro</div>
                <div class="brand-sub">Создайте аккаунт</div>
            </div>
            <div class="input-group">
                <label>📧 Логин / Email</label>
                <input type="text" id="regLogin" placeholder="Введите ваш логин" autocomplete="username">
            </div>
            <div class="input-group">
                <label>🔒 Пароль</label>
                <input type="password" id="regPassword" placeholder="Введите пароль" autocomplete="new-password">
                <div class="password-hint">Минимальная длина: 6 символов</div>
            </div>
            <div class="input-group">
                <label>🔒 Подтверждение пароля</label>
                <input type="password" id="regAgainPassword" placeholder="Повторите пароль" autocomplete="new-password">
            </div>
            <div class="input-group">
                <label>👤 Роль</label>
                <select id="regRole">
                    <option value="user">Пользователь</option>
                    <option value="admin">Администратор</option>
                </select>
            </div>
            <button class="register-btn-submit" id="registerButton">Зарегистрироваться →</button>
            <div id="messageContainer"></div>
            <div class="footer-note">
                Уже есть аккаунт? <a href="/page/login">Войти</a>
            </div>
        </div>
    </div>
    <script>
    (function () {
        const registerBtn = document.getElementById('registerButton');
        const loginInput = document.getElementById('regLogin');
        const passwordInput = document.getElementById('regPassword');
        const againPasswordInput = document.getElementById('regAgainPassword');
        const roleSelect = document.getElementById('regRole');
        const messageContainer = document.getElementById('messageContainer');
        let isLoading = false;
        function showMessage(text, isError = true) {
            messageContainer.innerHTML = `
                <div class="${isError ? 'error-message' : 'success-message'}">
                    ${text}
                </div>
            `;
            if (isError) {
                setTimeout(() => {
                    if (messageContainer.innerHTML.includes(text)) {
                        messageContainer.innerHTML = '';
                    }
                }, 5000);
            }
        }
        function clearMessages() {
            messageContainer.innerHTML = '';
        }
        async function attemptRegister() {
            const login = loginInput.value.trim();
            const password = passwordInput.value;
            const againPassword = againPasswordInput.value;
            const role = roleSelect.value;
            clearMessages();
            if (login.length === 0) {
                showMessage('❌ Введите логин', true);
                loginInput.focus();
                return;
            }

            if (password.length === 0) {
                showMessage('❌ Введите пароль', true);
                passwordInput.focus();
                return;
            }
            if (password.length < 6) {
                showMessage('❌ Пароль должен содержать минимум 6 символов', true);
                passwordInput.focus();
                return;
            }
            if (againPassword.length === 0) {
                showMessage('❌ Подтвердите пароль', true);
                againPasswordInput.focus();
                return;
            }
            if (password !== againPassword) {
                showMessage('❌ Пароли не совпадают', true);
                againPasswordInput.focus();
                return;
            }
            if (isLoading) return;
            isLoading = true;
            registerBtn.disabled = true;
            const originalBtnText = registerBtn.innerHTML;
            registerBtn.innerHTML = '<span class="loading-spinner"></span> Регистрация...';
            try {
                const response = await fetch('/reg', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        login: login,
                        password: password,
                        againPassword: againPassword,
                        role: role
                    })
                });
                if (response.ok) {
                    showMessage('✅ Регистрация выполнена успешно! Перенаправление...', false);

                    setTimeout(() => {
                        window.location.href = '/index';
                    }, 800);
                } else if (response.status === 400) {
                    let errorText = '❌ Ошибка регистрации';
                    try {
                        const errorData = await response.text();
                        if (errorData && errorData.length > 0) {
                            errorText = `❌ ${errorData}`;
                        }
                    } catch (e) {}
                    showMessage(errorText, true);
                    const card = document.querySelector('.register-card');
                    card.style.transform = 'translateX(4px)';
                    setTimeout(() => { card.style.transform = ''; }, 100);
                } else if (response.status === 429) {
                    showMessage('⚠️ Слишком много попыток. Попробуйте позже.', true);
                } else if (response.status === 500) {
                    showMessage('⚠️ Внутренняя ошибка сервера. Попробуйте позже.', true);
                } else {
                    showMessage(`⚠️ Ошибка: ${response.status}. Попробуйте позже.`, true);
                }
            } catch (error) {
                console.error('Registration error:', error);
                let errorMsg = '⚠️ Не удалось соединиться с сервером. Проверьте подключение.';
                if (error.message && error.message.includes('Failed to fetch')) {
                    errorMsg = '⚠️ Сервер недоступен. Убедитесь, что сервер запущен.';
                }
                showMessage(errorMsg, true);
            } finally {
                isLoading = false;
                registerBtn.disabled = false;
                registerBtn.innerHTML = originalBtnText;
            }
        }
        registerBtn.addEventListener('click', attemptRegister);
        const handleEnter = (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                attemptRegister();
            }
        };
        loginInput.addEventListener('keypress', handleEnter);
        passwordInput.addEventListener('keypress', handleEnter);
        againPasswordInput.addEventListener('keypress', handleEnter);
        roleSelect.addEventListener('keypress', handleEnter);
    })();
    </script>
</body>
</html>
